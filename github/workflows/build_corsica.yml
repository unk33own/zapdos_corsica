name: Build Zapdos Corsica (Galaxy Pocket Neo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: corphish/zapdos_corsica
          path: kernel_workspace
          depth: 1

      - name: Install 32-bit Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-arm-linux-gnueabi libssl-dev libxml2-utils lzop schedtool zip zlib1g-dev

      - name: Compile Kernel (ARM 32-bit)
        run: |
          cd kernel_workspace
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="GitHubAction"
          export KBUILD_BUILD_HOST="Builder"
          
          DEFCONFIG=$(find arch/arm/configs -name "*corsica*" | grep "defconfig" | head -n 1 | xargs basename)
          
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm/configs -name "*bcm21654*" | grep "defconfig" | head -n 1 | xargs basename)
          fi
          
          echo "Found defconfig: $DEFCONFIG"
          
          make O=out $DEFCONFIG
          make -j$(nproc --all) O=out

      - name: Upload Compiled Kernel (zImage)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Corsica-Compiled-Kernel
          path: |
            kernel_workspace/out/arch/arm/boot/zImage
